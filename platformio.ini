[env]
platform = espressif32
framework = arduino
board = seeed_xiao_esp32s3
monitor_speed = 921600

[env:lepton]
build_src_filter = +<lepton.cpp>
upload_port = /dev/cu.usbmodem2101
monitor_port = /dev/cu.usbmodem2101
lib_deps = https://github.com/ducky64/arduino-lepton.git

[env:mlx]
build_src_filter = +<mlx.cpp>
upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101
lib_deps = adafruit/Adafruit MLX90640